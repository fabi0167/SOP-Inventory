<app-navbar></app-navbar>

<div class="container mt-4">
  <h2 class="mb-4">Dashboard</h2>

  <div *ngIf="isLoading" class="alert alert-info" role="alert">
    Indlæser dashboarddata...
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && summary" class="row g-3">

    <!-- Quick stats -->
    <div class="col-12">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Hurtigt overblik</h5>
          <div class="status-grid quick-stats-grid">
            <button type="button" class="status-card status-card-link emphasis-card quick-stat-card" (click)="goToAllItems()">
              <span class="visually-hidden">Gå til alle genstande</span>
              <p class="status-name">Samlet antal genstande</p>
              <p class="status-count">{{ summary.totalItemCount }}</p>
            </button>
            <button type="button" class="status-card status-card-link quick-stat-card" (click)="goToActiveLoans()">
              <span class="visually-hidden">Gå til aktive udlån</span>
              <p class="status-name">Aktive udlån</p>
              <p class="status-count">{{ summary.activeLoanCount }}</p>
            </button>
            <button
              type="button"
              class="status-card status-card-link warning-card quick-stat-card"
              (click)="goToNonFunctionalItems()"
              [disabled]="!hasNonFunctionalStatuses()"
            >
              <span class="visually-hidden">Se genstande med ikke-fungerende status</span>
              <p class="status-name">Ikke-fungerende genstande</p>
              <p class="status-count">{{ summary.nonFunctionalItemCount }}</p>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Status cards -->
    <div class="col-12">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Genstande efter status</h5>
          <div class="status-grid">
            <ng-container *ngFor="let status of getStatusCounts(); trackBy: trackStatusBy">
              <button
                type="button"
                class="status-card status-card-link"
                (click)="goToStatusItems(status.status)"
              >
                <span class="visually-hidden">Se genstande med status {{ status.status }}</span>
                <p class="status-name">{{ getStatusDisplayName(status.status) }}</p>
                <p class="status-count">{{ status.count }}</p>
              </button>
            </ng-container>
            <div *ngIf="getStatusCounts().length === 0" class="text-muted status-empty">
              Ingen statusdata tilgængelig.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts: bar (left) + pie (right) -->
    <div class="col-12">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <!-- Header row: left = bar chart title, right = pie chart title (aligned on same line) -->
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="card-title mb-0">Genstande efter status (diagram)</h5>
            <h5 class="card-title mb-0 text-center">Genstande efter status (Procentvis)</h5>
          </div>

          <div class="row" *ngIf="chartData?.length; else emptyChart">
            <div class="col-md-8">
              <ngx-charts-bar-vertical
                [results]="chartData"
                [scheme]="NgxColor"
                [customColors]="NgxColor"
                [view]="chartView"
                [gradient]="true"
                [animations]="false"
                [legend]="true"
                [legendPosition]="legendPosition"
                [xAxis]="true"
                [yAxis]="true"
                [showXAxisLabel]="showXAxisLabel"
                [xAxisLabel]="xAxisLabel"
                [showYAxisLabel]="showYAxisLabel"
                [yAxisLabel]="yAxisLabel"
                [yScaleMin]="0"
                [yScaleMax]="maxChartValue"
                [yAxisTicks]="yTicks"
                [roundEdges]="true"
                [tooltipDisabled]="false"
                [showDataLabel]="true"
                [barPadding]="32"
                aria-label="Vertikalt søjlediagram over genstandes status"
              ></ngx-charts-bar-vertical>
            </div>

            <div class="col-md-4 d-flex flex-column align-items-center justify-content-start mt-md-4">
              <!-- right title removed (moved to header) -->
              <div style="width:100%; max-width:320px;">
                <apx-chart
                  *ngIf="pieSeries?.length"
                  [series]="pieSeries"
                  [chart]="pieChart"
                  [labels]="pieLabels"
                  [responsive]="pieResponsive"
                  [legend]="pieLegend"
                  [colors]="pieColors"
                ></apx-chart>
              </div>
            </div>
          </div>

          <ng-template #emptyChart>
            <div class="text-muted status-empty">
              Ingen data til diagrammet.
            </div>
          </ng-template>
        </div>
      </div>
